<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cande's Designs</title>

    <meta name="description"
        content="Cande's Designs - Diseño, fotografía, contenido audiovisual y comunicación visual.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
        }

        /* PORTADA */

        .portada {
            width: 100%;
            height: 100dvh;
            min-height: 600px;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.20)
                ),
                url("portada.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* CONTENIDO DE LA PORTADA */

        .contenido-portada {
            text-align: center;
            color: white;
            padding: 20px;
            max-width: 900px;
        }

        .contenido-portada h1 {
            font-size: clamp(2.8rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 15px;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.35);
        }

        .contenido-portada p {
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 2px;
            margin-bottom: 35px;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.4);
        }

        /* BOTÓN */

        .boton {
            display: inline-block;

            padding: 15px 30px;

            background: white;
            color: #111;

            text-decoration: none;

            border-radius: 50px;

            font-size: 1rem;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .boton:hover {
            transform: translateY(-3px);
            background: #1769ff;
            color: white;
        }

        /* MENÚ */

        .menu {
            position: absolute;

            top: 25px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 20px;

            z-index: 10;
        }

        .menu ul {
            list-style: none;

            display: flex;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;

            font-size: 0.95rem;
            font-weight: 600;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.5);

            transition: 0.3s ease;
        }

        .menu a:hover {
            opacity: 0.7;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .portada {
                min-height: 100dvh;

                background-position: center center;
            }

            .menu {
                top: 20px;
            }

            .menu ul {
                gap: 16px;
            }

            .menu a {
                font-size: 0.78rem;
            }

            .contenido-portada {
                width: 100%;
                padding: 25px;
            }

            .contenido-portada h1 {
                font-size: clamp(2.5rem, 12vw, 4rem);
                letter-spacing: -1px;
            }

            .contenido-portada p {
                font-size: 0.9rem;
                letter-spacing: 1px;
                line-height: 1.5;
            }

            .boton {
                padding: 13px 25px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <main class="portada">

        <nav class="menu">
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="sobre-mi.html">Sobre mí</a>
                </li>

                <li>
                    <a href="portfolio.html">Portfolio</a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>

        <div class="contenido-portada">

            <h1>Cande's Designs</h1>

            <p>
                Diseño · Fotografía · Comunicación visual
            </p>

            <a href="sobre-mi.html" class="boton">
                Conoceme
            </a>

        </div>

    </main>

</body>

</html>
